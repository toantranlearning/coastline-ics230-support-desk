<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><rect width="1100" height="570" fill="#f3f7fb"/><text x="32" y="45" font-family="Arial" font-size="28" font-weight="bold" fill="#123d60">Your workspace: what to open and where to work</text><text x="32" y="82" font-family="Arial" font-size="20" fill="#334155">Instructional diagram — not a screenshot of Google Cloud Shell.</text><rect x="25" y="112" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="147" font-family="monospace" font-size="20" fill="#123d60">File list → site/</text><text x="420" y="147" font-family="Arial" font-size="20" fill="#1e293b">Read original files. Preview on port 8080.</text><rect x="25" y="182" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="217" font-family="monospace" font-size="20" fill="#123d60">File list → fixed/</text><text x="420" y="217" font-family="Arial" font-size="20" fill="#1e293b">Edit working files. Change preview port to 8081.</text><rect x="25" y="252" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="287" font-family="monospace" font-size="20" fill="#123d60">File list → reports/</text><text x="420" y="287" font-family="Arial" font-size="20" fill="#1e293b">Write your report. Download it for Canvas.</text><rect x="25" y="322" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="357" font-family="monospace" font-size="20" fill="#123d60">Editor (middle)</text><text x="420" y="357" font-family="Arial" font-size="20" fill="#1e293b">Open a file, edit its text, then save.</text><rect x="25" y="392" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="427" font-family="monospace" font-size="20" fill="#123d60">Terminal (bottom)</text><text x="420" y="427" font-family="Arial" font-size="20" fill="#1e293b">Run: bash scripts/start.sh</text><rect x="25" y="462" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="497" font-family="monospace" font-size="20" fill="#123d60">Web Preview menu</text><text x="420" y="497" font-family="Arial" font-size="20" fill="#1e293b">8080 = original; Change port → 8081 = working.</text></svg>