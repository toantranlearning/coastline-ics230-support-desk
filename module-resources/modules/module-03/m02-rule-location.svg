<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" fill="#f3f7fb"/><text x="32" y="45" font-family="Arial" font-size="28" font-weight="bold" fill="#123d60">Put the rule here: fixed/router.php</text><text x="32" y="82" font-family="Arial" font-size="20" fill="#334155">Code-location diagram — keep the original site/router.php unchanged.</text><rect x="25" y="112" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="147" font-family="monospace" font-size="20" fill="#123d60">1. Existing $path = ...;</text><text x="420" y="147" font-family="Arial" font-size="20" fill="#1e293b">Find the line that reads the request path.</text><rect x="25" y="182" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="217" font-family="monospace" font-size="20" fill="#123d60">2. Add the /data/ rule</text><text x="420" y="217" font-family="Arial" font-size="20" fill="#1e293b">Paste the supplied block AFTER that line.</text><rect x="25" y="252" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="287" font-family="monospace" font-size="20" fill="#123d60">3. // The site root ...</text><text x="420" y="287" font-family="Arial" font-size="20" fill="#1e293b">Keep this existing section BELOW your rule.</text><rect x="25" y="322" width="1050" height="58" rx="8" fill="white" stroke="#a8bfd1"/><text x="42" y="357" font-family="monospace" font-size="20" fill="#123d60">4. Save; then test</text><text x="420" y="357" font-family="Arial" font-size="20" fill="#1e293b">php -l fixed/router.php → test port 8081.</text></svg>